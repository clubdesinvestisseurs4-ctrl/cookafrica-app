name: Backend — CI/CD (Cloud Run)

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
  workflow_dispatch: {}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - run: npm test

  deploy:
    name: Deploy sur Cloud Run
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Authentification GCP
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Déploiement Cloud Run — Dakar (site d'origine)
        uses: google-github-actions/deploy-cloudrun@251330ba9a8a34bfbc1622895f42e1d53fd14522 # v2
        with:
          service: cookafrica-api
          region: us-central1
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          source: ./server
          flags: --max-instances=1

      # Même code source (server/), même projet GCP — juste une région et un service
      # distincts, avec sa propre base Firestore nommée (voir FIRESTORE_DATABASE_ID
      # dans les variables d'env du service, configurées hors de ce workflow).
      - name: Déploiement Cloud Run — Dubaï
        uses: google-github-actions/deploy-cloudrun@251330ba9a8a34bfbc1622895f42e1d53fd14522 # v2
        with:
          service: cookafrica-api-dubai
          region: me-central1
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          source: ./server
          flags: --max-instances=1
