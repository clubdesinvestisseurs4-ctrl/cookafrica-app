name: Backend — CI/CD (Render + Cloud Run + AWS Lambda)

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
  workflow_dispatch: {}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      # npm install, pas ci : package-lock.json n'a pas encore été régénéré pour
      # serverless-http (ajouté pour le handler Lambda, voir server/lambda.js) --
      # à corriger plus tard avec un vrai `npm install` local pour reverrouiller
      # les versions exactes, ça marche pour l'instant sans bloquer le pipeline.
      - run: npm install
      - run: npm test

  deploy-render:
    name: Deploy sur Render (Côte d'Ivoire)
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Déclenche le déploiement via le Deploy Hook Render
        run: |
          status=$(curl -s -o /tmp/render_deploy.json -w "%{http_code}" \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          cat /tmp/render_deploy.json
          if [ "$status" != "200" ]; then
            echo "Échec du déclenchement Render (HTTP $status)" >&2
            exit 1
          fi

  deploy-cloudrun:
    name: Deploy sur Cloud Run
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Authentification GCP
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Déploiement Cloud Run — Côte d'Ivoire (site d'origine)
        uses: google-github-actions/deploy-cloudrun@251330ba9a8a34bfbc1622895f42e1d53fd14522 # v2
        with:
          service: cookafrica-api
          region: us-central1
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          source: ./server
          flags: --max-instances=1

      # Même code source (server/), même projet GCP — juste une région et un service
      # distincts, avec sa propre base Firestore nommée (voir FIRESTORE_DATABASE_ID
      # dans les variables d'env du service, configurées hors de ce workflow).
      - name: Déploiement Cloud Run — Dubaï
        uses: google-github-actions/deploy-cloudrun@251330ba9a8a34bfbc1622895f42e1d53fd14522 # v2
        with:
          service: cookafrica-api-dubai
          region: me-central1
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          source: ./server
          flags: --max-instances=1

  deploy-aws-lambda:
    name: Deploy sur AWS Lambda (filet de secours)
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2
        with:
          use-installer: true

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - run: sam build

      # Mêmes identifiants Firebase que Render/Cloud Run (mêmes secrets GitHub que
      # partout ailleurs, jamais un nouveau projet Firebase) et le MÊME JWT_SECRET
      # que Render : un jeton émis pendant que Render répond doit rester valide si
      # une requête bascule ensuite sur AWS pendant que Render se réveille (voir le
      # bascule automatique dans client/app.js) — un secret différent romprait la
      # session de l'utilisateur exactement au moment du basculement.
      - run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              FirebaseProjectId="${{ secrets.FIREBASE_PROJECT_ID }}" \
              FirebaseClientEmail="${{ secrets.FIREBASE_CLIENT_EMAIL }}" \
              FirebasePrivateKey="${{ secrets.FIREBASE_PRIVATE_KEY }}" \
              JwtSecret="${{ secrets.RENDER_JWT_SECRET }}"

      - name: Affiche l'URL de l'API déployée
        run: aws cloudformation describe-stacks --stack-name cookafrica-api --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text
