name: Garde Render éveillé (heures d'ouverture)

# L'offre gratuite Render met le service en veille après ~15 min sans requête ;
# le redémarrage à froid qui suit prend 20-30s, plus long que le timeout client
# (voir client/app.js et client/commander.js). Un ping toutes les 10 min pendant
# les heures d'ouverture évite la mise en veille dans l'immense majorité des cas,
# sans consommer tout le quota mensuel gratuit (750h/mois) en tournant 24h/24.
#
# Plage 05h-23h59 UTC = heure d'Abidjan (UTC+0, pas de changement d'heure) : ~19h/j,
# soit ~570h/mois pour ce seul ping — largement sous le plafond, marge pour le
# trafic réel en plus.
on:
  schedule:
    - cron: '*/10 5-23 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: curl -sf --max-time 60 https://cookafrica-api.onrender.com/health
